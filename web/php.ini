; Chatiferous. The WordPress site one folder up carries a cPanel-generated .user.ini that sets
; PHP's limits for everything below it, this app included: 5M per upload, an 8M POST, 64M of
; memory. A photo straight off a phone is 3-12M, and PHP answers an oversized upload by throwing
; it away and handing the script an empty $_FILES — which a member sees as "The upload didn't
; arrive." These raise the limits for /bible/ only; WordPress keeps its own.
;
; Settings not named here (Wordfence's auto_prepend_file among them) still come down from the
; parent file untouched.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 120
